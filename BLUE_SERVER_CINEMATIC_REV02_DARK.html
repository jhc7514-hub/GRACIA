const items=[{name:'공지사항',en:'NOTICE',icon:'<path d="M5 15V9h5l12-5v16l-12-5zM10 15l2 7h4l-3-7M24 9q4 3 0 6"/>',body:'서버 쟁 및 PvP 교전 필수 규칙\n\n• 핵 및 불법 프로그램 사용 금지\n• 버그 및 시스템 악용 금지\n• 오토쟁 금지 (아드레날린 및 타워 사용 허용, 자동 교전 및 혈리 오토 금지)\n• 교전 중 투컴 사용 금지\n• 혈맹 간 언플, 인신공격 및 패드립 금지\n• 중립 혈맹 공격 및 무분별한 PK 금지\n\n위반 사항은 GM이 직접 확인 후 판단하며, 사전 경고 없이 제재될 수 있습니다.'},{name:'서버정보',en:'SERVER INFORMATION',icon:'<rect x="4" y="5" width="24" height="8" rx="2"/><rect x="4" y="19" width="24" height="8" rx="2"/><path d="M9 9h1M9 23h1M16 9h11M16 23h11"/>',body:'LINEAGE II HIGH FIVE 기반\nGRAND OPEN · 2026.09.28 18:00\n\n경험치 3배 / SP 3배\n아데나 5~10배 / 레이드 드롭 2배\n동일 IP 최대 10계정 (10월 21일 업데이트 반영)\n초기화 없음 · 장수 서버 지향\n매일 18:00 서버 자동 리붓\n\n영지별 사냥터, 필드 레이드, 통합 인스턴스 던전, 서브클래스, PvP, 팀배틀, 투지의 전장, 장비 승급 시스템 운영.'},{name:'서버규정',en:'SERVER RULES',icon:'<path d="M16 3l11 5v8c0 8-5 12-11 15C10 28 5 24 5 16V8zM11 16l4 4 7-8"/>',body:'공정한 경쟁과 서버 운영을 위한 규정\n\n1. 불법 프로그램 및 시스템 악용 금지\n2. 자동 PvP 교전 및 교전 중 투컴 사용 금지\n3. 혈맹 간 인신공격, 패드립 금지\n4. 중립 유저 강제 쟁 유도 및 무분별한 PK 금지\n5. 위반 여부 및 제재는 GM이 직접 확인하여 판단\n\n모든 혈맹에 동일한 규정을 적용합니다.'},{name:'업데이트',en:'UPDATE HISTORY',icon:'<path d="M16 4v7l5 3M29 16a13 13 0 1 1-4-9M29 5v8h-8"/>',body:'2026.10.23\n• 한방 제련에 STR/CON/INT/MEN +1 옵션 추가\n• 엘레기아 방어구 타입 교환 NPC 추가\n• 자유 텔레포트 3종 가격 인하\n\n2026.10.22\n• 궁수 PvE 데미지 5% 상향\n• 스페셜 레이드 부하 몬스터 레벨 85로 변경\n\n2026.10.21\n• 이벤트 메달/고대 아데나 상점 아데나 상점으로 변경\n• 프리미엄 가격 10,000원으로 변경\n• 동일 IP 접속 10계정으로 확대\n\n2026.10.20\n• 사냥터 레벨별 드롭 제한 조정\n• 파티 경험치 레벨 차이 19레벨로 확대\n• 헬바운드 24시간 개방\n• 한방 제련 비용 20,000 블루 엘코인\n\n2026.10.17\n• 헬바운드 87레벨 PvP 사냥터 개편\n\n2026.10.01\n• 버프 12시간, 버프 슬롯 확대 및 사망 경험치 손실 완화'}];
const cards=document.getElementById('cards');cards.innerHTML=items.map((x,i)=>`<button class="card" data-index="${i}"><span class="num">0${i+1} / BLUE SERVER</span><span class="medal"><svg viewBox="0 0 32 32" aria-hidden="true">${x.icon}</svg></span><strong>${x.name}</strong><span class="en">${x.en}</span><span class="arrow">↗</span></button>`).join('');let busy=false;document.getElementById('start').addEventListener('click',()=>{if(busy)return;busy=true;document.getElementById('flash').classList.add('go');setTimeout(()=>{document.getElementById('intro').classList.add('leave');document.getElementById('main').classList.add('visible');},650);setTimeout(()=>{document.getElementById('flash').remove();document.getElementById('intro').remove()},1650)});cards.addEventListener('click',e=>{let b=e.target.closest('[data-index]');if(!b)return;let x=items[+b.dataset.index];document.getElementById('detail-title').textContent=x.name;document.getElementById('detail-en').textContent=x.en;document.getElementById('detail-body').textContent=x.body;document.getElementById('detail').classList.add('show');document.body.style.overflow='hidden'});document.getElementById('back').onclick=()=>{document.getElementById('detail').classList.remove('show');document.body.style.overflow=''};
</script></body></html>
